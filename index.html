function save(){
  let n=$('#docTitle').value||'無題';
  if(!n.endsWith(EXT)) n+=EXT;
  try{
    dl(n,JSON.stringify({format:FMT,version:3.1,S,names,macros,ps},null,2),'application/json');
    $('#stat').textContent='保存しました: '+n;
  }catch(e){$('#stat').textContent='保存に失敗しました';}
}
async function openFile(f){
  try{
    let o=JSON.parse(await f.text());
    if(o.format!==FMT)throw Error('非対応形式');
    S=o.S||[bs('シート1')];names=o.names||{};macros=o.macros||{};ps=o.ps||{orientation:'landscape',grid:true,header:'',footer:'迪温算盤'};
    si=0;$('#docTitle').value=f.name.replace(EXT,'');render();$('#stat').textContent='読み込みました';
  }catch(e){alert('ファイルの読み込みに失敗しました: '+e.message);}
}

function buildSeriesTabs(){
  const labels=['ホーム','挿入','数式','データ','グラフ','表示'];
  document.querySelectorAll('#ribbonTabs .tab').forEach((b,i)=>b.onclick=()=>selectSeriesTab(i));
  selectSeriesTab(0);
  const qat=document.querySelector('#qat');
  [['save',save,'保存'],['undo',un,'元に戻す'],['redo',re,'やり直す'],['print',()=>print(),'印刷']].forEach(([id,fn,title])=>{const b=document.createElement('button');b.innerHTML='<svg class="ic"><use href="#'+id+'"/></svg>';b.title=title;b.onclick=fn;qat.append(b)});
  document.querySelector('#docTitle').onchange=e=>document.title=e.target.value+'.tivencs - 迪温算盤';
  document.querySelector('#zout').onclick=()=>setSeriesZoom(+document.querySelector('#zoom').value-10);
  document.querySelector('#zin').onclick=()=>setSeriesZoom(+document.querySelector('#zoom').value+10);
  document.querySelector('#zoom').oninput=e=>setSeriesZoom(e.target.value);
  setSeriesZoom(100);
  setTimeout(()=>{const sp=document.querySelector('#splash');sp.classList.add('out');setTimeout(()=>sp.remove(),550)},900);
}
function selectSeriesTab(i){document.querySelectorAll('#ribbonTabs .tab').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('#rpages .rpage').forEach((x,j)=>x.classList.toggle('show',i===j))}
function setSeriesZoom(n){n=Math.max(50,Math.min(160,+n));document.querySelector('#grid').style.zoom=n/100;document.querySelector('#zoom').value=n;document.querySelector('#zlabel').textContent=n+'%'}
</script></body></html>
